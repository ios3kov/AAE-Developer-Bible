name: Editorial Model Scan Export

on:
  push:
    branches:
      - audit/editorial-model-scan-2026-10-01

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tar -czf /tmp/bible-editorial-scan.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: bible-editorial-scan
          path: /tmp/bible-editorial-scan.tgz
          if-no-files-found: error
