name: Editorial Model Scan 2

on:
  push:
    branches:
      - audit/editorial-model-scan2-2026-10-01

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tar -czf /tmp/bible-editorial-scan2.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: bible-editorial-scan2
          path: /tmp/bible-editorial-scan2.tgz
          if-no-files-found: error
