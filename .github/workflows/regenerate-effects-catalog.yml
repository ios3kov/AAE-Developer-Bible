name: Regenerate docs

on:
  push:
    branches:
      - main
    paths-ignore:
      - "MASTER-AE-DEVELOPER-BIBLE.md"
      - "MANIFEST.sha256"

permissions:
  contents: write

concurrency:
  group: regenerate-docs-main
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate and commit from latest main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git fetch origin main
            git checkout -B main origin/main

            python3 scripts/build_docs.py
            git add MASTER-AE-DEVELOPER-BIBLE.md MANIFEST.sha256

            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -m "Regenerate generated documentation"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main moved during regeneration; retrying from latest main"
            sleep 2
          done

          echo "failed to publish regenerated documentation after retries" >&2
          exit 1
