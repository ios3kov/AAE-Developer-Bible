name: Regenerate docs

on:
  push:
    branches:
      - main
    paths-ignore:
      - "MASTER-AE-DEVELOPER-BIBLE.md"
      - "MANIFEST.sha256"

permissions:
  contents: read

concurrency:
  group: regenerate-docs-main
  cancel-in-progress: true

jobs:
  regenerate:
    permissions:
      contents: write
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Regenerate and commit from latest main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch origin main
            git checkout -B main origin/main

            source_sha=$(git rev-parse HEAD)
            echo "Regeneration source Git SHA: $source_sha" >> "$GITHUB_STEP_SUMMARY"
            python3 scripts/docs_lane.py --lane source >> "$GITHUB_STEP_SUMMARY"
            python3 scripts/build_docs.py
            python3 scripts/build_docs.py --check
            git add MASTER-AE-DEVELOPER-BIBLE.md MANIFEST.sha256

            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -m "Regenerate generated documentation" -m "Source-Git-SHA: $source_sha"
            python3 scripts/build_docs.py --check

            if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main; then
              echo "Generated commit Git SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "main moved during regeneration; retrying from latest main"
            sleep 2
          done

          echo "failed to publish regenerated documentation after retries" >&2
          exit 1
