name: Regenerate docs

on:
  push:
    paths:
      - "**/*.md"
      - "*.md"
      - "!MASTER-AE-DEVELOPER-BIBLE.md"
      - "scripts/build_docs.py"
      - ".github/workflows/regenerate-effects-catalog.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate MASTER and manifest
        run: python3 scripts/build_docs.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MASTER-AE-DEVELOPER-BIBLE.md MANIFEST.sha256
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate generated documentation"
          git push
