name: Publish AE Developer Bible v1.0

on:
  push:
    paths:
      - ".github/workflows/bootstrap-v1.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand verified payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .bootstrap/v1/payload.b64 > /tmp/aae-v1.tar.gz
          mkdir -p /tmp/aae-v1
          tar -xzf /tmp/aae-v1.tar.gz -C /tmp/aae-v1

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name .github ! -name .bootstrap \
            -exec rm -rf {} +

          cp -a /tmp/aae-v1/. .

          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-v1.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          git commit -m "Publish AE Developer Bible v1.0"
          git push
