name: Editorial Final Scan

on:
  push:
    branches:
      - audit/editorial-final-scan-2026-10-01

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tar -czf /tmp/bible-editorial-final.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: bible-editorial-final
          path: /tmp/bible-editorial-final.tgz
          if-no-files-found: error
