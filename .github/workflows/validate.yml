name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      lane:
        description: Source staging or frozen generated revision
        type: choice
        options: [source, frozen]
        default: source
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: CEP bridge portable protocol tests (not AE host tests)
        run: node scripts/test_cep_bridge.js
      - name: Scripting lesson portable safety (not AE host tests)
        run: node scripts/test_scripting_lessons.js
      - name: Illustrative evidence plan structure (not AE host tests)
        run: python -m unittest scripts.test_evidence_plan -v
      - name: Z-depth collector portable safety tests (not AE host tests)
        run: node scripts/test_acx_depth_probe.js
      - name: Edge and frame-export portable safety tests (not AE host tests)
        run: node scripts/test_acx_edge_render_probe.js
      - name: Withdrawn Mega entry point has no AE or filesystem access
        run: node scripts/test_acx_mega_withdrawal.js
      - name: Safe tooling destructive and false-success tests
        run: python -m unittest scripts.test_safe_tools -v
      - name: Native compiler driver portable tests
        run: python -m unittest scripts.test_check_native -v
      - name: Validate SDK runner shell syntax
        run: |
          bash -n 18-SDK-HEADER-TOOLS/run-macos.sh
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("18-SDK-HEADER-TOOLS/run-windows.ps1",[ref]$tokens,[ref]$errors) | Out-Null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'
      - name: Compile native protocol headers
        run: c++ -std=c++17 -Wall -Wextra -Werror scripts/test_protocol_headers.cpp -o /tmp/protocol-headers-test
      - run: /tmp/protocol-headers-test
      - name: Portable versioned state codec (not AE persistence test)
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror scripts/test_versioned_state.cpp -o /tmp/state-codec-test
          /tmp/state-codec-test
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m unittest discover -s 18-SDK-HEADER-TOOLS/tests -v
      - run: >-
          c++ -std=c++17 -Wall -Wextra -Werror
          -I19-NATIVE-CODE-FOUNDATION/tests/stubs
          -I19-NATIVE-CODE-FOUNDATION/code
          19-NATIVE-CODE-FOUNDATION/tests/test_foundation.cpp -o /tmp/foundation-test
      - run: /tmp/foundation-test
      - name: Documentation consistency regressions
        run: |
          python -m unittest discover -s tests/consistency -v
          python scripts/check_docs_consistency.py
      - name: Reviewed source table consistency (not runtime certification)
        run: |
          python -m unittest discover -s tests/sources -v
          python scripts/generate_sources_table.py --check
      - name: Select validation lane and report exact identities
        id: docs-lane
        env:
          REQUESTED_LANE: ${{ inputs.lane || 'auto' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/docs_lane.py --lane "$REQUESTED_LANE" --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/docs-identity.json"
          cat "$RUNNER_TEMP/docs-identity.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Reject stale frozen outputs before regeneration
        if: steps.docs-lane.outputs.lane == 'frozen'
        run: python scripts/build_docs.py --check
      - name: Stage source documentation without changing the checkout
        run: |
          python scripts/build_docs.py --output-root "$RUNNER_TEMP/bible-validation"
          python scripts/build_docs.py --check --output-root "$RUNNER_TEMP/bible-validation"
          cp mkdocs.yml "$RUNNER_TEMP/bible-validation/mkdocs.yml"
          mkdocs build --strict --site-dir "$RUNNER_TEMP/bible-site" --config-file "$RUNNER_TEMP/bible-validation/mkdocs.yml"

  macos-path-regression:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Record exact checkout and run native-driver portable regressions
        run: |
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          python -m unittest scripts.test_check_native -v
