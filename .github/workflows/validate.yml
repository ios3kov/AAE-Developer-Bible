name: Validate
on: [push, pull_request]
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m unittest discover -s 18-SDK-HEADER-TOOLS/tests -v
      - run: >-
          c++ -std=c++17 -Wall -Wextra -Werror
          -I19-NATIVE-CODE-FOUNDATION/tests/stubs
          -I19-NATIVE-CODE-FOUNDATION/code
          19-NATIVE-CODE-FOUNDATION/tests/test_foundation.cpp -o /tmp/foundation-test
      - run: /tmp/foundation-test
      - name: Verify generated documentation
        run: |
          python scripts/build_docs.py
          git diff --exit-code -- MASTER-AE-DEVELOPER-BIBLE.md MANIFEST.sha256
      - run: mkdocs build --strict
