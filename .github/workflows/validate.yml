name: Validate
on: [push, pull_request]
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Z-depth collector portable safety tests (not AE host tests)
        run: node scripts/test_acx_depth_probe.js
      - name: Edge and frame-export portable safety tests (not AE host tests)
        run: node scripts/test_acx_edge_render_probe.js
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m unittest discover -s 18-SDK-HEADER-TOOLS/tests -v
      - run: >-
          c++ -std=c++17 -Wall -Wextra -Werror
          -I19-NATIVE-CODE-FOUNDATION/tests/stubs
          -I19-NATIVE-CODE-FOUNDATION/code
          19-NATIVE-CODE-FOUNDATION/tests/test_foundation.cpp -o /tmp/foundation-test
      - run: /tmp/foundation-test
      - name: Generate documentation for validation
        run: python scripts/build_docs.py
      - run: mkdocs build --strict
