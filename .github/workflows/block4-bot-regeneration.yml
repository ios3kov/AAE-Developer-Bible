name: PR documentation regeneration
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: pr-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  regenerate-pr-head:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-docs.txt
      - name: Verify exact source and regenerate
        env:
          PR_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_SOURCE_SHA"
          python -m unittest discover -s tests/consistency -v
          python scripts/check_docs_consistency.py
          python scripts/build_docs.py
          python scripts/build_docs.py --check
          mkdocs build --strict
      - name: Package generated commit without publishing credentials
        env:
          PR_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          REGEN_PACKET: ${{ runner.temp }}/pr-regeneration
        run: |
          set -euo pipefail
          mkdir -p "$REGEN_PACKET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MASTER-AE-DEVELOPER-BIBLE.md MANIFEST.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate documentation for PR source" -m "Source-Git-SHA: $PR_SOURCE_SHA"
            python scripts/build_docs.py --check
            git bundle create "$REGEN_PACKET/generated.bundle" HEAD "^$PR_SOURCE_SHA"
          fi
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from scripts.build_docs import source_digest, tracked_files
          head = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          record = {'source_git_sha':os.environ['PR_SOURCE_SHA'], 'generated_git_sha':head,
                    'source_content_sha256':source_digest(tracked_files()),
                    'changed':head != os.environ['PR_SOURCE_SHA'],
                    'workflow_run_id':os.environ['GITHUB_RUN_ID']}
          packet = Path(os.environ['REGEN_PACKET'])
          (packet/'provenance.json').write_text(json.dumps(record,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('```json\n'+json.dumps(record,indent=2)+'\n```\n')
          print(json.dumps(record,indent=2))
          PY
          cp MASTER-AE-DEVELOPER-BIBLE.md MANIFEST.sha256 "$REGEN_PACKET/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-regeneration-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pr-regeneration/
          if-no-files-found: error
          retention-days: 14
