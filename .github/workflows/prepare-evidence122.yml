name: Prepare Bible 1.2.2 evidence
on:
  push:
    branches: [release/bible-1.2.2-evidence]
    paths: ['.github/workflows/prepare-evidence122.yml', '.github/prepare-evidence122.py']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'ios3kov/AAE-Developer-Bible' && github.ref == 'refs/heads/release/bible-1.2.2-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-docs.txt
      - name: Validate the supplied evidence and prepare exact blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/prepare-evidence122.py
