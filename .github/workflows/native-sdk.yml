name: Native SDK gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-sdk-gate:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check affected native inputs against the pinned licensed SDK
        env:
          NATIVE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AE_SDK_ARCHIVE_URL: ${{ secrets.AE_SDK_ARCHIVE_URL }}
          AE_SDK_ARCHIVE_SHA256: ${{ vars.AE_SDK_ARCHIVE_SHA256 }}
          AE_SDK_HEADERS_SHA256: ${{ vars.AE_SDK_HEADERS_SHA256 }}
        run: |
          python scripts/ci_native_gate.py --report "$RUNNER_TEMP/native-gate.json"
      - name: Record actual scope without publishing SDK files
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/native-gate.json"; then
            cat "$RUNNER_TEMP/native-gate.json" >> "$GITHUB_STEP_SUMMARY"
          fi
