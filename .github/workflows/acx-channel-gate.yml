name: ACX channel gate
on:
  push:
    paths:
      - 'scripts/acx_channel_gate.py'
      - 'scripts/test_acx_channel_gate.py'
      - 'scripts/acx_fixture_candidate.py'
      - 'scripts/test_acx_fixture_candidate.py'
      - '.github/workflows/acx-channel-gate.yml'
  pull_request:
    paths:
      - 'scripts/acx_channel_gate.py'
      - 'scripts/test_acx_channel_gate.py'
      - 'scripts/acx_fixture_candidate.py'
      - 'scripts/test_acx_fixture_candidate.py'
      - '.github/workflows/acx-channel-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-capture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic native-readout protocol tests (no Adobe host)
        run: python -m unittest discover -s scripts -p test_acx_channel_gate.py -v
      - name: Existing known-input regression tests (no Adobe host)
        run: python -m unittest discover -s scripts -p test_acx_fixture_candidate.py -v
      - name: Compile Python sources
        run: python -m py_compile scripts/acx_channel_gate.py scripts/test_acx_channel_gate.py
