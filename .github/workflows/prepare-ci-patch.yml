name: Prepare Bible CI patch
on:
  push:
    branches: [fix/bible-ci-gates-1.2.1]
    paths: ['.github/workflows/prepare-ci-patch.yml', '.github/prepare-ci-patch.py']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'ios3kov/AAE-Developer-Bible' && github.ref == 'refs/heads/fix/bible-ci-gates-1.2.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-docs.txt
      - name: Prepare and test final bytes, store blobs only; never update a branch or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/prepare-ci-patch.py
